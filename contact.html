                                    aria-live="polite"
                                ></span>
                            </div>

                                    required
                                    maxlength="120"
                                    autocomplete="email"
                                    placeholder="you@example.com"
                                />
                                <span
                                    class="contact-error"
                                    aria-live="polite"
                                ></span>
                            </div>
                        </div>
                        <div class="contact-field">
                            <label for="contact-subject">Subject</label>
                            <input
                                id="contact-subject"
                                name="subject"
                                type="text"
                                maxlength="120"
                                placeholder="What is it about?"
                            />
                        </div>
                        <div class="contact-field">
                            <label for="contact-message">Message</label>
                            <textarea
                                id="contact-message"
                                name="message"
                                rows="6"
                                required
                                maxlength="2000"
                                placeholder="Tell me about it…"
                            ></textarea>
                            <span
                                class="contact-error"
                                aria-live="polite"
                            ></span>
                        </div>
                        <div class="contact-actions">
                            <button type="submit" class="contact-submit">
